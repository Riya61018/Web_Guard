kind = "web"
previewPath = "/"
title = "Parental Controls"
version = "1.0.0"
id = "artifacts/parental-controls"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20460

[services.development]
run = "pnpm --filter @workspace/parental-controls run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/parental-controls", "run", "build" ]
publicDir = "artifacts/parental-controls/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20460"
BASE_PATH = "/"
