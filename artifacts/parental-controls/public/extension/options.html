<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeGuard Extension — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo svg { color: #3b82f6; }
    .logo-text { font-size: 18px; font-weight: 600; }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    p.sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #374151; }
    input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.1); }
    .hint { font-size: 12px; color: #9ca3af; margin-top: -14px; margin-bottom: 18px; }
    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #2563eb; }
    .status {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      color: #16a34a;
      min-height: 20px;
    }
    .status.error { color: #dc2626; }
    .divider { border: none; border-top: 1px solid #e2e8f0; margin: 24px 0; }
    .test-result {
      font-size: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
    }
    .test-result.blocked { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .test-result.allowed { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span class="logo-text">SafeGuard</span>
    </div>

    <h1>Extension Settings</h1>
    <p class="sub">Connect this extension to your SafeGuard dashboard.</p>

    <label for="apiUrl">SafeGuard API URL</label>
    <input type="url" id="apiUrl" placeholder="https://your-app.replit.app" />
    <p class="hint">Copy the URL of your SafeGuard app (no trailing slash).</p>

    <label for="profileId">Profile ID to enforce</label>
    <input type="number" id="profileId" placeholder="1" min="1" />
    <p class="hint">Find the Profile ID on the Extension Setup page in SafeGuard.</p>

    <button id="save">Save Settings</button>
    <div class="status" id="status"></div>

    <hr class="divider" />

    <label for="testDomain">Test a domain</label>
    <input type="text" id="testDomain" placeholder="facebook.com" />
    <button id="testBtn" style="background:#64748b">Test Connection</button>
    <div class="test-result" id="testResult"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
