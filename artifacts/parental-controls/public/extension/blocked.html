<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Site Blocked — SafeGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      max-width: 420px;
      padding: 24px;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      background: #eff6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon-wrap svg {
      color: #3b82f6;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .domain {
      font-size: 15px;
      color: #3b82f6;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-all;
    }
    .category {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      margin-bottom: 20px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .back-btn {
      display: inline-block;
      padding: 10px 24px;
      background: #3b82f6;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .back-btn:hover { background: #2563eb; }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .footer svg { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>

    <h1>Site Blocked</h1>
    <div class="domain" id="domain">—</div>
    <div class="category" id="category" style="display:none"></div>
    <p>This website is blocked by your family's SafeGuard parental controls.</p>

    <button class="back-btn" onclick="history.back()">Go Back</button>

    <div class="footer">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Protected by SafeGuard
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const domain = params.get("domain") || "";
    const category = params.get("category") || "";

    if (domain) document.getElementById("domain").textContent = domain;

    if (category) {
      const el = document.getElementById("category");
      el.textContent = category;
      el.style.display = "inline-block";
    }
  </script>
</body>
</html>
